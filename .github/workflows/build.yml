name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # gta_sa.exe — 32-битный; чтобы загрузить библиотеку в его процесс, лаунчер тоже должен быть x86
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p plugjam-core
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri build --target i686-pc-windows-msvc
        env:
          # необязательно: сервисный ключ VK для настоящих обложек проектов (секрет репозитория)
          PLUGJAM_VK_TOKEN: ${{ secrets.PLUGJAM_VK_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: plugjam-windows-x86
          path: |
            target/i686-pc-windows-msvc/release/bundle/nsis/*.exe
            target/i686-pc-windows-msvc/release/plugjam.exe
